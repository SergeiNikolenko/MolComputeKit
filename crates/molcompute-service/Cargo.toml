[package]
name = "molcompute-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Isolated authenticated helper service for MolComputeKit Metal execution"

[dependencies]
base64 = "0.23"
burrete-compute-core = { path = "../burrete-compute-core", version = "0.1.0" }
burrete-compute-metal = { path = "../burrete-compute-metal", version = "0.1.0" }
burrete-compute-protocol = { path = "../burrete-compute-protocol", version = "0.1.0" }
libc = "0.2"
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "molcompute-service"
path = "src/bin/molcompute-service.rs"

